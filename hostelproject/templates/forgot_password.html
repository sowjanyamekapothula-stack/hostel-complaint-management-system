<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #1e3a8a;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Forgot Password</h2>

    <p>
        Enter your Student ID and Room Number
        to reset your password.
    </p>

    <form action="/forgot_password" method="POST">

        <label>Student ID / Roll Number</label>

        <input
            type="text"
            name="student_id"
            placeholder="Enter Student ID"
            required
        >

        <label>Room Number</label>

        <input
            type="text"
            name="room_number"
            placeholder="Enter Room Number"
            required
        >

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter New Password"
            required
        >

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a class="back" href="/login">
        ← Back to Login
    </a>

</div>

</body>
</html>
