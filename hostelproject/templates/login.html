<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f7fb;
        }

        .header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .link a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>
        Hostel Complaint Management System
    </h1>

</div>


<div class="container">

    <div class="card">

        <h2>
            Student Login
        </h2>


        <form method="POST" action="/login">

            <label>
                Student ID / Roll Number
            </label>

            <input
                type="text"
                name="student_id"
                placeholder="Enter Student ID"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="link">

            <a href="/forgot_password">
                Forgot Password?
            </a>

        </div>


        <div class="link">

            <a href="/register">
                Create New Account
            </a>

        </div>

    </div>

</div>


</body>

</html>
