<!DOCTYPE html>
<html>

<head>

    <title>Create Account</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f7fb;
        }

        .header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .link a {
            color: #1e3a8a;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>
        Hostel Complaint Management System
    </h1>

</div>


<div class="container">

    <div class="card">

        <h2>
            Create Account
        </h2>


        <form method="POST" action="/register">


            <label>
                Student Name
            </label>

            <input
                type="text"
                name="student_name"
                placeholder="Enter your name"
                required
            >


            <label>
                Student ID / Roll Number
            </label>

            <input
                type="text"
                name="student_id"
                placeholder="Enter Student ID"
                required
            >


            <label>
                Room Number
            </label>

            <input
                type="text"
                name="room_number"
                placeholder="Enter Room Number"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


    </div>

</div>


</body>

</html>
